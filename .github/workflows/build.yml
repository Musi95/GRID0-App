name: Build GRID0

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish GRID0.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=false -o publish/${{ matrix.rid }}

      - name: Zip
        run: cd publish/${{ matrix.rid }} && zip -r ../../GRID0-${{ matrix.rid }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GRID0-${{ matrix.rid }}
          path: GRID0-${{ matrix.rid }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.txt <<'EOF'
          the very first GRID0 client build.

          what it does

          installs zerotier if you don't have it, joins the GRID0 network, and
          watches the connection so you know when it drops instead of staring
          at a fake green dot.

          also points your switch emulators at the zerotier adapter for LAN
          play. close them first, it backs up your configs before touching
          anything.

          grab the zip for your OS. windows will ask for admin, mac will ask
          for your password, that's normal. if your OS complains on first run
          it's because the build isn't signed.
          EOF
          if gh release view ${{ github.ref_name }} >/dev/null 2>&1; then
            gh release upload ${{ github.ref_name }} artifacts/GRID0-*/GRID0-*.zip --clobber
          else
            gh release create ${{ github.ref_name }} \
              --title "GRID0 ${{ github.ref_name }}" \
              --notes-file notes.txt \
              artifacts/GRID0-*/GRID0-*.zip
          fi
